<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In - 11-235</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./common.css">
  <link rel="stylesheet" href="./sign-in-11-235.css">
</head>
<body>
  <div id="screen-sign-in-11-235" class="screen" style="background:#ffffff;">
    <!-- Group: Title -->
    <div class="group title" style="left:30px; top:94px; width:155px; height:75px;">
      <p class="text hello" style="left:0px; top:0px; width:84px; height:45px;">Hello,</p>
      <p class="text welcome" style="left:0px; top:45px; width:155px; height:30px;">Welcome Back!</p>
    </div>

    <!-- Input field: Email -->
    <div class="component input-field email" style="left:30px; top:226px; width:315px; height:81px;">
      <div class="rect input-bg" style="left:0px; top:26px; width:315px; height:55px;"></div>
      <p class="text placeholder" style="left:20px; top:45px; width:100px; height:17px;">Enter Email</p>
      <p class="text label" style="left:0px; top:0px; width:38px; height:21px;">Email</p>
    </div>

    <!-- Input field: Password -->
    <div class="component input-field password" style="left:30px; top:337px; width:315px; height:81px;">
      <div class="rect input-bg" style="left:0px; top:26px; width:315px; height:55px;"></div>
      <p class="text placeholder" style="left:20px; top:45px; width:110px; height:17px;">Enter Password</p>
      <p class="text label" style="left:0px; top:0px; width:107px; height:21px;">Enter Password</p>
    </div>

    <!-- Forgot Password -->
    <div class="group forgot" style="left:40px; top:438px; width:120px; height:17px;">
      <p class="text forgot-link" style="left:0px; top:0px; width:120px; height:17px;">Forgot Password?</p>
    </div>

    <!-- CTA Big Button -->
    <button class="button cta" style="left:30px; top:480px; width:315px; height:60px;">
      <span class="label">Sign In</span>
      <img class="arrow-icon" src="figmaimages/figma_image_54_668_53_625.svg" alt="Arrow Right">
    </button>

    <!-- Or Sign in With line + text -->
    <div class="group or-with" style="left:90px; top:560px; width:195px; height:17px;">
      <div class="line" style="left:145px; top:9px; width:50px; height:0px;"></div>
      <div class="line" style="left:0px; top:9px; width:50px; height:0px;"></div>
      <p class="text or-text" style="left:57px; top:0px; width:81px; height:17px;">Or Sign in With</p>
    </div>

    <!-- Social Button: Google -->
    <div class="group social google" style="left:131px; top:597px; width:44px; height:44px;">
      <img class="rect btn-bg" src="figmaimages/figma_image_13_36.svg" alt="Button Background" style="left:0px; top:0px; width:44px; height:44px;">
      <img class="icon" src="figmaimages/figma_image_13_39.svg" alt="Google Yellow" style="left:12px; top:12px; width:20px; height:20px;">
      <img class="icon" src="figmaimages/figma_image_13_42.svg" alt="Google Blue" style="left:22px; top:20px; width:10px; height:9.4141206741px;">
    </div>

    <!-- Social Button: Facebook -->
    <div class="group social facebook" style="left:200px; top:597px; width:44px; height:44px;">
      <div class="rect btn-bg" style="left:0px; top:0px; width:44px; height:44px;"></div>
      <img class="icon" src="figmaimages/figma_image_13_58.svg" alt="Facebook Icon" style="left:10px; top:10px; width:24px; height:24px;">
    </div>

    <!-- Signup text -->
    <p class="text signup" style="left:99px; top:696px; width:177px; height:17px;">Don’t have an account? Sign up</p>

    <!-- Status Bar -->
    <div class="component status-bar" style="left:0px; top:0px; width:375px; height:44px;">
      <img src="figmaimages/figma_image_13_71_128_309.svg" alt="Battery Fill" style="position:absolute; left:338px; top:19px; width:18px; height:7.6666665077px;">
      <img src="figmaimages/figma_image_13_71_128_311.svg" alt="Cell 1" style="position:absolute; left:293.5px; top:24.3px; width:3px; height:4px;">
      <img src="figmaimages/figma_image_13_71_128_312.svg" alt="Cell 2" style="position:absolute; left:298.3px; top:22.3px; width:3px; height:6px;">
      <img src="figmaimages/figma_image_13_71_128_313.svg" alt="Cell 3" style="position:absolute; left:302.9px; top:20px; width:3px; height:8.3px;">
      <img src="figmaimages/figma_image_13_71_128_314.svg" alt="Cell 4" style="position:absolute; left:307.6px; top:18px; width:3px; height:10.7px;">
      <p class="text time" style="left:29.5px; top:12px; width:37px; height:18px;">19:27</p>
    </div>

    <!-- Home Indicator -->
    <div class="component home-indicator" style="left:0px; top:778px; width:375px; height:34px;">
      <div class="home-bar" style="left:120px; top:21px; width:135px; height:5px;"></div>
    </div>
  </div>

  <script src="./app.js"></script>
  <script src="./sign-in-11-235.js"></script>
</body>
</html>
